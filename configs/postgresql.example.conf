# PostgreSQL Configuration Snippet for pgBackRest WAL Archiving
# Add these settings to /etc/postgresql/14/main/postgresql.conf

# ==============================
# Write-Ahead Log (WAL) Settings
# ==============================

# Determines how much information is written to the WAL.
# Must be set to 'replica' or higher to support archiving and point-in-time recovery.
wal_level = replica

# Enable continuous WAL archiving. When active, completed WAL segments are passed
# to the command defined by archive_command.
archive_mode = on

# The shell command executed by PostgreSQL to archive completed WAL segments.
# pgBackRest uses 'archive-push' to safely and asynchronously copy WALs to the repository.
# '%p' is replaced by the path of the file to archive.
archive_command = 'pgbackrest --stanza=main archive-push %p'

# Force a WAL segment switch if a segment remains open for more than this number of seconds.
# This guarantees that WAL changes are archived at least every 60 seconds, which bounds
# your RPO (Recovery Point Objective) to 60 seconds under normal operations.
# Adjust upward for extremely busy database write workloads to prevent high WAL file counts.
archive_timeout = 60

# Max number of concurrent connections from standby servers or backup clients.
# A minimum of 3 is recommended when taking backups and supporting replication.
max_wal_senders = 3
