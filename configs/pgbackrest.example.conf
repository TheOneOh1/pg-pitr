# pgBackRest Production Configuration Template
# Place this file at /etc/pgbackrest.conf

[global]
# Path to the backup repository (where backups and WAL logs are stored)
# Ideally, this directory should reside on a separate physical disk or network storage.
repo1-path=/var/lib/pgbackrest

# ==============================
# Retention Policies
# ==============================
# Keep 7 full backups. Once an 8th full backup is taken, the oldest full backup
# and all its associated differential, incremental, and WAL files are purged.
repo1-retention-full=7

# Keep differential backups for 7 days, aligned with the full retention window.
repo1-retention-diff=7

# ==============================
# Performance & Async Archiving
# ==============================
# Force an immediate checkpoint when a backup begins, rather than waiting for 
# PostgreSQL's next scheduled checkpoint. Ensures backups start immediately.
start-fast=y

# Number of background processes to use for backup compression and transmission.
# Scale this based on available CPU cores.
process-max=2

# Enable asynchronous WAL archiving. This prevents PostgreSQL transaction commits 
# from blocking on WAL segment transmission to the backup repository.
archive-async=y

# Temporary storage location used for tracking asynchronous WAL archiving status.
# Required when archive-async=y.
spool-path=/var/spool/pgbackrest

# ==============================
# Storage Optimization
# ==============================
# Bundle multiple small files into larger bundles during backup. Highly recommended 
# for database clusters with a high count of small tables to reduce file overhead.
repo1-bundle=y

# Enable block-level incremental backups. Only modified blocks within a file 
# are backed up rather than the entire file, significantly saving space.
repo1-block=y

# ==============================
# Compression Settings
# ==============================
# Use Zstandard compression, which is significantly faster than gzip for backups.
compress-type=zst
compress-level=3

# ==============================
# Logging Settings
# ==============================
# Level of logging written to stdout (useful when run manually).
log-level-console=info

# Detailed level of logging written to log files for debugging.
log-level-file=detail

# Suppress logging to stderr. This prevents cron from sending noisy empty emails.
log-level-stderr=off

# Directory where backup and restore logs are written.
log-path=/var/log/pgbackrest

# ==============================
# Stanza Definition
# ==============================
[main]
# Absolute path to the PostgreSQL database cluster data directory.
# Must match the output of `SHOW data_directory;` in PostgreSQL.
pg1-path=/var/lib/postgresql/14/main

# PostgreSQL database server listening port.
pg1-port=5432
